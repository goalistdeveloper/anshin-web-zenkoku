<!-- ============================================================

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap');
  :root { --ink: #1C1C1A; --paper: #F7F5F0; --gold: #8E6F41; --text-sub: #6B665C; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--ink); line-height: 1.9; background: var(--paper);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { max-width: 480px; width: 100%; text-align: center; }
  .logo { height: 22px; margin-bottom: 40px; }
  .mark { font-family: 'Cormorant Garamond', serif; font-size: 40px; color: var(--gold); margin-bottom: 20px; }
  h1 { font-size: 21px; font-weight: 500; margin-bottom: 20px; }
  p { color: var(--text-sub); font-size: 14.5px; margin-bottom: 12px; }
  .btn { display: inline-block; margin-top: 28px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none;
    font-weight: 700; padding: 14px 36px; font-size: 13px; letter-spacing: .1em; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/img/logo-totonoe.png" alt="TOTONOE">
    <div class="mark">✓</div>
    <h1>お問い合わせありがとうございます</h1>
    <p>この度はご相談のお申し込みをいただき、誠にありがとうございます。</p>
    <p>担当者より2営業日以内にご連絡させていただきます。今しばらくお待ちくださいませ。</p>
    <p>お急ぎの場合は、お電話でも承っております。</p>
    <p>03-4361-2643（平日 10:00〜19:00）</p>
    <a class="btn" href="index.html">トップページへ戻る</a>
  </div>
</body>
</html>
