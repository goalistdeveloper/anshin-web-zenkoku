<style>
  :root {
    --green-deep: #1F7A55; --green-accent: #3DBB7E; --green-pale: #EDF7F2;
    --text-main: #1F2933; --text-sub: #52606D;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic Medium", YuGothic, sans-serif;
    color: var(--text-main); line-height: 1.8; background: var(--green-pale);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; border-radius: 16px; max-width: 560px; width: 100%; padding: 48px 40px;
    text-align: center; box-shadow: 0 12px 32px rgba(31,122,85,.12);
  }
  .logo { height: 32px; margin-bottom: 28px; }
  .icon { width: 64px; height: 64px; border-radius: 50%; background: var(--green-accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  p { color: var(--text-sub); font-size: 15px; margin-bottom: 10px; }
  .btn { display: inline-block; margin-top: 24px; background: var(--green-deep); color: #fff; text-decoration: none;
    font-weight: 700; padding: 14px 32px; border-radius: 999px; }

    <p>お急ぎの場合は、お電話でも承っております。</p>
    <p>03-4361-2643（平日 10:00〜19:00）</p>
