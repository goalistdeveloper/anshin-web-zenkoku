<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Shippori+Mincho:wght@400;500&display=swap');
html,body{margin:0;padding:0;}
.card{
  width:1200px; height:630px; position:relative; overflow:hidden; background:#1C1C1A;
  font-family:'Cormorant Garamond', serif;
}
.card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.55; filter:grayscale(35%); }
.overlay{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(28,28,26,.35) 0%, rgba(28,28,26,.55) 55%, rgba(28,28,26,.92) 100%); }
.content{ position:absolute; left:0; right:0; bottom:64px; text-align:center; color:#F7F5F0; }
.word{ font-size:64px; letter-spacing:0.32em; padding-left:0.32em; font-weight:500; }
.sub{ font-family:'Shippori Mincho', serif; font-size:16px; letter-spacing:0.35em; padding-left:0.35em; color:#C9B98E; margin-top:14px; }
</style></head>
<body>
<div class="card">
  <img src="../img/seikotsuin-shisetsu-naibu-shashin.jpg">
  <div class="overlay"></div>
  <div class="content">
    <div class="word">TOTONOE</div>
    <div class="sub">整骨院・接骨院専門　ホームページ制作</div>
  </div>
</div>
</body></html>
